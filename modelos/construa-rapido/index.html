<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projete Rápido — Estúdio de Design com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000000; color: #fff;
    font-family: 'Instrument Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; }

  /* Navbar */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; background: transparent;
  }
  .nav-sun { width: 24px; height: 24px; }
  .nav-center { display: flex; align-items: center; gap: 32px; }
  .nav-link {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.8);
    transition: color 0.2s;
  }
  .nav-link:hover { color: #fff; }
  .nav-link svg { width: 14px; height: 14px; }
  .nav-right { display: flex; align-items: center; gap: 20px; }
  .nav-demo { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.8); transition: color 0.2s; }
  .nav-demo:hover { color: #fff; }
  .nav-cta {
    background: #fff; color: #000; border-radius: 999px;
    padding: 10px 20px; font-size: 14px; font-weight: 600;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .nav-cta:hover { transform: scale(1.04); box-shadow: 0 0 20px rgba(255,255,255,0.25); }
  @media (max-width: 860px) { .nav-center { display: none; } }

  /* Hero */
  .hero {
    position: relative; width: 100%; min-height: 100vh; min-height: 100svh;
    background: #000; color: #fff; overflow: hidden;
  }
  .hero-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0.6;
  }
  .hero-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .glow-a {
    position: absolute; top: -20%; left: 20%; width: 600px; height: 600px;
    background: rgba(30,58,138,0.2); filter: blur(120px);
    mix-blend-mode: screen; border-radius: 50%; pointer-events: none;
  }
  .glow-b {
    position: absolute; bottom: -10%; right: 20%; width: 500px; height: 500px;
    background: rgba(49,46,129,0.2); filter: blur(120px);
    mix-blend-mode: screen; border-radius: 50%; pointer-events: none;
  }

  .hero-content {
    position: relative; z-index: 10;
    max-width: 64rem; margin: 0 auto;
    padding: 0 24px; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 48px;
  }
  .pre {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: clamp(28px, 3.4vw, 48px); line-height: 1.1; color: #fff;
    animation: fadeUp 0.6s ease both;
  }
  .h1 {
    font-family: 'Instrument Sans', sans-serif; font-weight: 600;
    font-size: clamp(56px, 9.5vw, 136px); line-height: 0.9; letter-spacing: -0.04em;
    background: linear-gradient(180deg, #ffffff 0%, #ffffff 55%, #b4c0ff 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: zoom 0.6s 0.2s cubic-bezier(0.16,1,0.3,1) both;
  }
  .sub {
    font-size: clamp(17px, 1.6vw, 20px); line-height: 1.65;
    color: rgba(255,255,255,0.7); max-width: 36rem;
    animation: fadeIn 0.6s 0.4s ease both;
  }
  .ctas {
    display: flex; flex-direction: column; align-items: center; gap: 24px;
    animation: rise 0.5s 0.6s ease both;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 8px 8px 8px 24px; border-radius: 999px;
    background: #fff; color: #0a0400;
    font-size: 18px; font-weight: 500;
    transition: transform 0.25s, box-shadow 0.25s;
  }
  .btn-primary:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
  }
  .btn-primary .arrow {
    width: 40px; height: 40px; border-radius: 999px;
    background: #3054ff; display: flex; align-items: center; justify-content: center;
    transition: background 0.25s;
  }
  .btn-primary:hover .arrow { background: #2040e0; }
  .btn-primary .arrow svg { width: 20px; height: 20px; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 8px;
    color: rgba(255,255,255,0.7); font-size: 16px; font-weight: 500;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: color 0.2s, background 0.2s;
  }
  .btn-ghost:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .btn-ghost svg { width: 16px; height: 16px; transition: transform 0.2s; }
  .btn-ghost:hover svg { transform: translateX(4px); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes zoom { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 0.7; } }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  @media (min-width: 640px) { .ctas { flex-direction: row; } }
  @media (prefers-reduced-motion: reduce) {
    .pre, .h1, .sub, .ctas { animation: none; opacity: 1; }
    .sub { opacity: 0.7; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="#" aria-label="Início">
    <svg class="nav-sun" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4" fill="#fff" stroke="none"/>
      <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>
    </svg>
  </a>
  <div class="nav-center">
    <a class="nav-link" href="#servicos">Serviços <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
    <a class="nav-link" href="#portfolio">Portfólio</a>
    <a class="nav-link" href="#processo">Processo</a>
    <a class="nav-link" href="#planos">Planos</a>
  </div>
  <div class="nav-right">
    <a class="nav-demo" href="#demo">Agende uma Demo</a>
    <a class="nav-cta" href="#comecar">Começar Grátis</a>
  </div>
</nav>

<section class="hero">
  <video class="hero-video" id="bgvid" muted loop playsinline preload="metadata"
    poster="https://images.unsplash.com/photo-1647356191320-d7a1f80ca777?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxhYnN0cmFjdCUyMGRhcmslMjB0ZWNobm9sb2d5JTIwbmV1cmFsJTIwbmV0d29ya3xlbnwxfHx8fDE3Njg5NzIyNTV8MA&ixlib=rb-4.1.0&q=80&w=1080"></video>
  <div class="hero-overlay" aria-hidden="true"></div>
  <div class="glow-a" aria-hidden="true"></div>
  <div class="glow-b" aria-hidden="true"></div>

  <div class="hero-content">
    <p class="pre">Design na velocidade da ideia</p>
    <h1 class="h1">Projete Rápido</h1>
    <p class="sub">Crie identidades, interfaces e experiências visuais de nível profissional em minutos com o nosso motor de IA de design.</p>
    <div class="ctas">
      <a class="btn-primary" href="#comecar">
        <span>Comece a Projetar Grátis</span>
        <span class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </a>
      <a class="btn-ghost" href="#projetos">
        <span>Ver Projetos</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>
<script>
(function () {
  var video = document.getElementById('bgvid');
  var src = "https://stream.mux.com/T6oQJQ02cQ6N01TR6iHwZkKFkbepS34dkkIc9iukgy400g.m3u8";
  if (!video) return;
  function tryPlay() { video.play().catch(function (e) { console.log('Autoplay impedido:', e); }); }
  if (window.Hls && window.Hls.isSupported()) {
    var hls = new window.Hls();
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(window.Hls.Events.MANIFEST_PARSED, tryPlay);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = src;
    video.addEventListener('loadedmetadata', tryPlay);
  }
})();
</script>
</body>
</html>
